name: CI

# Static gate: type-check, lint and the unit suite on every push and PR.
# `next build` is deliberately NOT here — it needs the Supabase env at build
# time and belongs to release verification (DoR §F), not the per-commit gate.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the older, still-running job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and lint
        run: npm run check

      - name: Unit tests
        run: npm test
